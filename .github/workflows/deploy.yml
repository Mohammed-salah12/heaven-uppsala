name: Deploy frontend to GitHub Pages

# Builds the static, backend-free showcase build of the Next.js frontend and
# publishes it to GitHub Pages. The base path is set automatically from the
# repo name, so it works for project pages (user.github.io/<repo>) out of the box.

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"        # user/org page → served at root
          else
            echo "path=/$REPO" >> "$GITHUB_OUTPUT"  # project page → served under /<repo>
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Build static export
        working-directory: frontend
        env:
          NEXT_PUBLIC_STATIC: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_TELEMETRY_DISABLED: '1'
          # Set these as repo secrets (Settings → Secrets and variables → Actions)
          # once you have real easyTable credentials, so live booking works on
          # the deployed site. Baked into the built JS — see README "Table booking".
          NEXT_PUBLIC_EASYTABLE_API_KEY: ${{ secrets.NEXT_PUBLIC_EASYTABLE_API_KEY }}
          NEXT_PUBLIC_EASYTABLE_PLACE_TOKEN: ${{ secrets.NEXT_PUBLIC_EASYTABLE_PLACE_TOKEN }}
          NEXT_PUBLIC_EASYTABLE_PLACE_TOKEN_BAKFICKAN: ${{ secrets.NEXT_PUBLIC_EASYTABLE_PLACE_TOKEN_BAKFICKAN }}
        run: |
          npm run build
          touch out/.nojekyll   # let GitHub Pages serve the _next/ folder

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
